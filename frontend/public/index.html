<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#313bac" />

    <title>Khalil Fathalli — Software Engineer & Full Stack Web Developer</title>
    <meta
      name="description"
      content="Khalil Fathalli is a software engineer and full stack web developer with a Master of Engineering in Computer Science. Portfolio of React, Angular, Spring Boot, Laravel and Symfony projects."
    />
    <meta name="author" content="Khalil Fathalli" />
    <link rel="canonical" href="https://khalilf-portfolio.netlify.app/" />

    <link rel="icon" href="%PUBLIC_URL%/logo.png" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- The hero font is render-blocking otherwise; preconnect shaves a round trip. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Sanity serves every image on the page. -->
    <link rel="preconnect" href="https://cdn.sanity.io" />

    <!-- Open Graph: controls how the link previews on LinkedIn, Slack, WhatsApp. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://khalilf-portfolio.netlify.app/" />
    <meta property="og:title" content="Khalil Fathalli — Software Engineer & Full Stack Web Developer" />
    <meta
      property="og:description"
      content="Portfolio of a software engineer and full stack web developer working with React, Angular, Spring Boot, Laravel and Symfony."
    />
    <meta property="og:image" content="https://khalilf-portfolio.netlify.app/logo512.png" />
    <meta property="og:image:alt" content="Khalil Fathalli" />
    <meta property="og:locale" content="en_US" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Khalil Fathalli — Software Engineer & Full Stack Web Developer" />
    <meta
      name="twitter:description"
      content="Portfolio of a software engineer and full stack web developer working with React, Angular, Spring Boot, Laravel and Symfony."
    />
    <meta name="twitter:image" content="https://khalilf-portfolio.netlify.app/logo512.png" />

    <!-- Structured data: lets Google show this as a person/profile result. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Khalil Fathalli",
        "url": "https://khalilf-portfolio.netlify.app/",
        "jobTitle": "Software Engineer and Full Stack Web Developer",
        "email": "mailto:fathaallikhalil@gmail.com",
        "alumniOf": {
          "@type": "CollegeOrUniversity",
          "name": "ESPRIT — Private School of Engineering and Technology"
        },
        "knowsAbout": [
          "React",
          "Angular",
          "Node.js",
          "Spring Boot",
          "Laravel",
          "Symfony",
          "PostgreSQL",
          "Docker"
        ],
        "sameAs": [
          "https://www.linkedin.com/in/khalil-fathalli/",
          "https://github.com/KhalilF7",
          "https://www.xing.com/profile/Khalil_Fathalli"
        ]
      }
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
